<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tea House</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/1d78b149a4.js" crossorigin="anonymous"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: 'Manrope', sans-serif;
        }
    </style>
</head>

<body>

<main class="max-w-screen-xl mx-auto px-6 lg:px-16">

    <!-- Header Section -->
<header class="flex flex-col lg:flex-row items-center pt-10 mb-20 gap-10">

    <!-- Text Content -->
    <div>
        <h1 class="text-5xl lg:text-7xl font-bold leading-tight">
            It's good <br>
            tea time at The <br>
            Tea House
        </h1>

        <p class="text-[#777777] mt-4">
            Tea and Botanical Solutions Supplier Give Optimum 
            Satisfaction To Your Taste Buds.
        </p>

        <!-- Button -->
        <button class="mt-5 bg-gradient-to-r from-[#FF0000] to-[#FF8938] px-6 py-3 rounded-lg text-white font-bold flex items-center gap-2">
            Explore More
            <i class="fa-solid fa-arrow-down -rotate-45"></i>
        </button>
    </div>

    <!-- Image Section -->
    <div class="relative">
        <img src="images/banner.png" alt="Tea Banner" class="w-full">

        <!-- Card -->
        <div class="absolute flex items-center bg-white rounded-lg shadow-lg px-4 py-2 md:px-10 top-20 md:top-80 md:left-32 lg:left-28">
            
            <i class="text-3xl text-yellow-400 fa-solid fa-star"></i>

            <div class="ml-3">
                <h2 class="text-xl lg:text-3xl font-bold">5.00</h2>
                <p class="text-[#777777] text-sm">Trust Pilot Ratings</p>
            </div>

        </div>
    </div>

</header>

</main>

</body>
</html>
